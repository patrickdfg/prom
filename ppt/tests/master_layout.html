(async()=>{
 const html=await(await fetch('../index.html')).text(),doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script').forEach(e=>e.remove());for(const el of [...doc.body.children])document.body.append(el);

 const p={version:1,lines:['첫 번째 문구 강조','두 번째 문구'],slides:[a,b,other],links:[{status:'manual',start:0,end:8},{status:'unlinked',start:null,end:null},{status:'unlinked',start:null,end:null}],layoutMasters:{}};const originals=structuredClone(p);

 verify.onclick=async()=>{try{const check=(v,m)=>{if(!v)throw Error(m)};const body=s=>s.shapes[s.bodyIndex];check(body(p.slides[0]).x===-96&&body(p.slides[1]).w===1152,'같은 레이아웃 두 장 적용');check(body(p.slides[2]).x===body(originals.slides[2]).x,'다른 레이아웃 유지');check(JSON.stringify(p.links)===JSON.stringify(originals.links),'원고 연결 유지');check(p.slides[1].text===originals.slides[1].text,'다른 장 문구 유지');check(body(p.slides[0]).paragraphs[0].runs.some(r=>r.color==='#ff0000'),'부분 강조 유지');const next=await CaptionBuilder.scene('caption','이후 새 자막');check(body(next).x===-96&&body(next).w===1152,'새 자막 마스터 상속');const saved=JSON.parse(JSON.stringify(p));check(Object.keys(saved.layoutMasters).length===1,'작업 저장');const design=await CaptionBuilder.snapshotTemplate();check(Object.keys(design.layoutMasters).length===1,'제작 템플릿 저장');const blob=await CaptionPptx.create(p),zip=await JSZip.loadAsync(blob),xml=await zip.file('ppt/slides/slide1.xml').async('string');check(xml.includes('x="-914400"'),'PPTX 음수 좌표');check(xml.includes('cx="10972800"'),'PPTX 120% 너비');const cues=JSON.parse(await zip.file('prom/cues.json').async('string'));check(!!cues.layoutMasters['generated:caption'],'PPTX 마스터 설정 저장');check(cues.editors[0].masterId==='generated:caption','PPTX 레이아웃 연결 저장');const imported=await CaptionImport.deck(new File([blob],'master-test.pptx'));check(imported.slides[0].masterId==='generated:caption','PPTX 재열기 레이아웃 연결');check(imported.slides[0].shapes[imported.slides[0].bodyIndex].x===-96,'PPTX 재열기 음수 위치');document.getElementById('testStatus').textContent='PASS · 두 장 일괄 적용 / 다른 레이아웃·문구·원고 연결·강조색 유지 / 새 자막 상속 / 작업·템플릿·PPTX 저장 / 음수 위치·120% 너비';document.body.dataset.pass='true';}catch(e){document.getElementById('testStatus').textContent='FAIL '+e.stack;document.body.dataset.pass='false';}};
 document.getElementById('testStatus').textContent='마스터 편집 → 왼쪽 -10 / 너비 120 → 적용 → 검증';

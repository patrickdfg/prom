<!doctype html><html lang="ko"><meta charset="utf-8"><title>자막 생성 검증</title><link rel="stylesheet" href="../style.css"><style>body{height:auto;padding:20px}.samples{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.sample .slide-host{width:100%}h2{font-size:16px}</style><h1>자막 생성·템플릿 검증</h1><pre id="result">실행 중…</pre><div id="samples" class="samples"></div><script src="../vendor.js"></script><script src="../hwp-reader.js"></script><script src="../core.js"></script><script src="../importers.js"></script><script src="../render.js"></script><script src="../builder.js"></script><script>
(async()=>{const assert=(v,m)=>{if(!v)throw Error(m);};const z=new JSZip();z.file('Contents/header.xml','<head><charPr id="0" textColor="#000000"/><charPr id="1" textColor="#0000FF"/><charPr id="2" textColor="#008000"/><charPr id="3" textColor="#FF0000"/></head>');z.file('Contents/section0.xml','<section><p><run charPrIDRef="0"><t>오늘 말씀을 시작합니다.</t></run></p><p><run charPrIDRef="1"><t>작은 일에도 </t></run><run charPrIDRef="3"><t>감사하며</t></run><run charPrIDRef="1"><t> 살아갑시다.</t></run></p><p><run charPrIDRef="0"><t>일반 설명은 자막으로 만들지 않습니다.</t></run></p><p><run charPrIDRef="2"><t>(요 16:13) 진리의 성령이 오시면.</t></run></p><p><run charPrIDRef="0"><t>다음 말씀을 읽겠습니다.</t></run></p><p><run charPrIDRef="2"><t>서로 사랑하며 살아갑시다.</t></run></p></section>');const file=new File([await z.generateAsync({type:'uint8array'})],'색상원고.hwpx');const rich=await CaptionImport.manuscriptRich(file);assert(rich.lines.length===6,'원고 줄 누락');assert(rich.richLines[1].runs[1].hex==='FF0000','빨강 누락');const project={version:1,...rich,slides:[],links:[]},generated=await CaptionBuilder.generate(project,{cumulative:true});assert(generated.slides.length===3,'검정 본문 제외 또는 색 구간 개수');assert(generated.slides[0].shapes.some(s=>s.paragraphs?.some(p=>p.runs.some(r=>r.color==='#ff0000'&&r.text==='감사하며'))),'빨강 텍스트 유지');assert(generated.slides[1].editor.layout==='verse','성구 구분');const ix=CaptionCore.index(rich.lines);assert(generated.links.every((l,i)=>CaptionCore.normalize(generated.slides[i].text).endsWith(ix.text.slice(l.start,l.end))),'원문 직접 연결');assert(CaptionBuilder.speakerLayout('첫 줄\n성령님 말씀')==='wordSpirit','둘째 줄 화자');assert(CaptionBuilder.speakerLayout('첫 줄\n둘째 줄\n성령님 말씀')==='word','셋째 줄에서 화자 오판');for(const [name,expected] of [['성령님','wordSpirit'],['하나님','wordGod'],['성자','wordSon'],['선생님','wordTeacher']]){const text=name+'께서 말씀하셨습니다.',p={lines:[text],richLines:[{text,runs:[{text,hex:'008000'}]}]},r=await CaptionBuilder.generate(p);assert(r.slides[0].editor.layout===expected,name+' 배경');const body=r.slides[0].shapes[r.slides[0].bodyIndex];assert(body.paragraphs.every(p=>p.lineSpacing.value===1.3),'1.3배 줄간격');assert(body.paragraphs[0].runs[0].font==='마루 부리OTF 굵은'&&Math.abs(body.paragraphs[0].runs[0].size-23*96/72)<.001,'원본 23pt 글꼴');}const wide='작은 일에도 감사하고 서로를 사랑하면서 매일 기쁘게 살아가도록 합시다.',wideResult=await CaptionBuilder.generate({lines:[wide],richLines:[{text:wide,runs:[{text:wide,hex:'0000FF'}]}]},{cumulative:false});assert(wideResult.slides[0].editor.text.split('\n')[0].length>30,'30자 조기 줄바꿈');assert(wideResult.slides[0].shapes[wideResult.slides[0].bodyIndex].paragraphs.length<=2,'두 줄 하단 자막');for(const [layout,title] of Object.entries(CaptionBuilder.layouts)){const scene=await CaptionBuilder.scene(layout,'“말씀을 마음에 새기고\n<r>감사하며</r> 살아갑시다.”',{ref:layout==='verse'||layout==='passage'?'요한복음 16장 13절':'',date:'2026년 10월 18일 주일말씀'});const card=document.createElement('section');card.className='sample';const h=document.createElement('h2');h.textContent=title;const host=document.createElement('div');host.className='slide-host';card.append(h,host);document.querySelector('#samples').append(card);CaptionRender.show(host,scene);}await document.fonts.ready;document.querySelector('#result').textContent='PASS HWPX 색상·빨강 강조·검정 제외·성구 분류·직접 원고 연결·모든 템플릿·화자 자동 배경·1.3배·원본 23pt·실측 줄바꿈';document.body.dataset.pass='true';})().catch(e=>{document.querySelector('#result').textContent='FAIL '+e.stack;document.body.dataset.pass='false';});
</script></html>

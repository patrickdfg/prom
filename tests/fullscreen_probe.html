<!doctype html><html lang="ko"><meta charset="utf-8"><title>전체화면 자동 요청 검사</title><pre id="result">검사 중</pre><script>const delay=Number(new URLSearchParams(location.search).get('delay'))||0;setTimeout(async()=>{const result={kind:'fullscreen-probe',delay,activation:navigator.userActivation?.isActive};try{await document.documentElement.requestFullscreen();result.success=true;}catch(e){result.success=false;result.error=e.name;result.reason=e.message;}document.querySelector('#result').textContent=JSON.stringify(result,null,2);opener?.postMessage(result,location.origin);},delay);</script></html>

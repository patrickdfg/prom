<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실제 크롬 음성인식 시험</title><style>body{font:16px/1.6 'Malgun Gothic',sans-serif;background:#111a28;color:#edf3fc;padding:24px;max-width:1200px;margin:auto}button,select{font:inherit;background:#263c58;color:white;border:1px solid #7293bb;border-radius:6px;padding:10px;margin:5px}button:disabled{opacity:.4}pre{white-space:pre-wrap;background:#1c2b40;padding:16px;border-radius:8px}audio{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#1c2b40;padding:16px;border-radius:8px}small{color:#b4c5dd}textarea{width:95%;height:150px;background:#101824;color:white;font:inherit}meter{width:200px}</style>
<h1>실제 크롬 음성인식 시험</h1><p>크롬 Web Speech의 실제 인식 이벤트만 기록합니다. 로컬 받아쓰기를 입력하지 않습니다. 원고 위치 판정 로직은 그대로 사용합니다.</p>
<p id="environment">환경 확인 중</p><div><button id="check">직접 입력 지원 확인</button><button id="permission">마이크 허용 확인</button><span id="micstate">마이크 대기</span> <meter id="meter" min="0" max="0.1" value="0"></meter></div>
<div><label>점검 녹음 <select id="job"></select></label><button id="outputcheck">스피커 소리 2분 확인</button><button id="rawmicprobe">반향 제거 끈 실제 마이크 점검</button><button id="rawmicfull">반향 제거 끈 실제 마이크 네 편</button><button id="humanprobe">직접 말하기 1분 점검</button><button id="externalprobe">음악 앱 재생 마이크 점검(2분)</button><button id="scheduledmic">휴대폰 예약 재생 네 편 기록</button><button id="nativeprobe">기본 크롬 마이크 30초 점검</button><button id="fullnative">기본 크롬 마이크 네 편 시험</button><button id="micprobe">1번 마이크 30초 점검</button><button id="trackprobe">2번 직접 입력 30초 점검</button><button id="bothprobe">두 경로 동시 30초 점검</button></div>
<div><button id="fullmic">1번 네 편 전체 시험</button><button id="selectedtrack">2번 선택한 편 전체 시험</button><button id="fulltrack">2번 네 편 전체 시험</button><button id="fullboth">네 편 · 두 경로 동시 전체 시험</button><button id="fullserial">네 편 · 두 경로 순차 전체 시험</button><button id="stop">시험 중지</button></div>
<p id="progress">대기</p><audio id="source" controls preload="metadata"></audio><small>1번은 기본 출력 장치에서 녹음이 재생되어 실제 기본 마이크로 들어가야 합니다. 이어폰 연결·음소거·주변 소리는 결과에 영향을 줍니다. 전체 시험은 원속도이며 동시 실행 시 약 2시간 2분, 순차 실행 시 약 4시간 4분입니다.</small>
<div class="grid"><div class="card"><h2>1번 · 실제 마이크</h2><p id="mic-status">대기</p><textarea id="mic-heard" readonly aria-label="마이크 실제 인식"></textarea></div><div class="card"><h2>2번 · 녹음 직접 입력</h2><p id="track-status">대기</p><textarea id="track-heard" readonly aria-label="직접 입력 실제 인식"></textarea></div></div><pre id="messages">시험 준비</pre>
<script>
'use strict';
const $=id=>document.getElementById(id),SR=window.SpeechRecognition||window.webkitSpeechRecognition,audio=$('source');
let config=null,ctx=null,destination=null,speaker=null,micStream=null,analyser=null,running=false,active=[],cancelled=false,jobDone=null,micTrackOverride=false,humanCheck=false,externalCheck=false,scheduledAt=null,scheduledSuite=false;
const info=m=>{$('messages').textContent=new Date().toLocaleTimeString()+' '+m+'\n'+$('messages').textContent.slice(0,12000)};
const request=async(url,data)=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v};
const routeCase=new URL(location.href).searchParams.get('case');if(routeCase)document.title='크롬 직접 입력 · '+routeCase;
const browser={userAgent:navigator.userAgent,constructor:SR?.name,origin:location.origin};
$('environment').textContent=navigator.userAgent+' · 음성인식 '+(SR?'지원':'없음');
async function context(){if(!ctx)ctx=new AudioContext();await ctx.resume();}
async function graph(){await context();if(!destination){destination=ctx.createMediaStreamDestination();speaker=ctx.createGain();ctx.createMediaElementSource(audio).connect(destination);const source=ctx.createMediaStreamSource(destination.stream);source.connect(speaker);speaker.connect(ctx.destination);}await ctx.resume();}
async function microphone(){if(micStream)return micStream;micStream=await navigator.mediaDevices.getUserMedia({audio:true});await context();analyser=ctx.createAnalyser();ctx.createMediaStreamSource(micStream).connect(analyser);$('micstate').textContent='입력: '+micStream.getAudioTracks()[0].label;info('기본 마이크 허용 확인');return micStream;}
function rms(){if(!analyser)return 0;const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);return Math.sqrt(a.reduce((s,x)=>s+x*x,0)/a.length)}
setInterval(()=>{$('meter').value=rms();if(running)$('progress').textContent='실행 중 · 녹음 '+Math.floor(audio.currentTime)+' / '+Math.floor(audio.duration||0)+'초 · 마이크 RMS '+rms().toFixed(4)},500);
$('permission').onclick=()=>{navigator.permissions.query({name:'microphone'}).then(p=>info('크롬 마이크 권한 상태: '+p.state));$('micstate').textContent='마이크 연결 요청 중';return microphone().catch(e=>info('마이크 권한/입력 오류: '+e.message));};
$('check').onclick=async()=>{try{await graph();const t=destination.stream.getAudioTracks()[0].clone();t.stop();const r=new SR();try{r.start(t);r.abort();info('종료된 트랙 검사에서 오류가 없어 직접 입력 지원을 확정할 수 없음')}catch(e){info('직접 입력 트랙 검사: '+e.name+' · '+e.message);$('environment').textContent+=' · 종료 트랙 검증 '+e.name}}catch(e){info(e.message)}};
function record(r,type,extra={}){const event={type,elapsed:(performance.now()-r.began)/1000,audioTime:audio.currentTime,...extra};r.queue=r.queue.then(()=>request('/api/run/'+r.id+'/event',event)).then(s=>{$(r.mode+'-status').textContent=s.status+' · 실제 인식 '+s.results+'건 · '+s.page+'/'+s.pages+'쪽 · '+s.cursor+'/'+s.manuscriptEnd+'자';return s}).catch(e=>{info('기록 저장 실패: '+e.message);return stopCurrent('storage-error')});return r.queue;}
async function recognition(mode,job,probe){
 const started=await request('/api/start',{mode,date:job.date,probe,browser:{...browser,scheduledAt,externalSource:scheduledSuite?'scheduled-phone-playlist':null,purpose:scheduledSuite?'external-player-recording':externalCheck?'external-player-calibration':humanCheck?'human-voice-calibration':'recording',input:mode==='track'?'recording-track':micTrackOverride?'physical-microphone-track-echo-off':'default-microphone'},device:mode==='mic'?micStream?.getAudioTracks()[0].getSettings():null});
 const r={id:started.id,mode,queue:Promise.resolve(),began:performance.now(),errors:0,starts:[],results:0,rec:new SR(),ready:false};active.push(r);
 r.rec.lang='ko-KR';r.rec.continuous=true;r.rec.interimResults=true;r.rec.maxAlternatives=1;
 let readyResolve,readyReject;const ready=new Promise((resolve,reject)=>{readyResolve=resolve;readyReject=reject});
 const timeout=setTimeout(()=>readyReject(Error(mode+' 연결 시작 시간 초과')),15000);
 const begin=()=>{try{if(mode==='track')r.rec.start(destination.stream.getAudioTracks()[0]);else if(micTrackOverride)r.rec.start(micStream.getAudioTracks()[0]);else r.rec.start()}catch(e){readyReject(e);stopCurrent('start-error')}};
 r.rec.onstart=()=>{r.ready=true;r.starts.push(performance.now());record(r,'recognition-start');clearTimeout(timeout);readyResolve();if(r.starts.filter(t=>performance.now()-t<5000).length>3)stopCurrent('rapid-recognition-restarts')};
 r.rec.onresult=e=>{r.results++;r.errors=0;const results=Array.from(e.results,x=>({isFinal:x.isFinal,alternatives:Array.from(x,a=>({transcript:a.transcript,confidence:a.confidence}))}));$(mode+'-heard').value=results.map(x=>x.alternatives[0]?.transcript||'').join('');record(r,'result',{resultIndex:e.resultIndex,results});};
 r.rec.onerror=e=>{r.errors++;info(mode+' 크롬 오류 '+e.error);record(r,'error',{error:e.error,message:e.message||''});if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)||r.errors>=(externalCheck?16:3)){readyReject(Error(e.error));stopCurrent('chrome-error:'+e.error)}};
 r.rec.onend=async()=>{r.ready=false;await record(r,'end');if(running&&!r.stopping)begin()};
 if(mode==='mic'&&micStream&&window.MediaRecorder){r.media=new MediaRecorder(micStream);r.media.ondataavailable=e=>{if(e.data.size)r.queue=r.queue.then(()=>fetch('/api/run/'+r.id+'/media',{method:'POST',body:e.data})).catch(err=>info('마이크 녹음 저장 오류 '+err.message))};r.media.start(5000);}
 begin();await ready;return r;
}
async function stopCurrent(status='stopped'){
 if(!running)return;running=false;audio.pause();const list=active.slice();for(const r of list){r.stopping=true;try{r.rec.stop()}catch(_){}if(r.media?.state==='recording')r.media.stop();}
 await new Promise(resolve=>setTimeout(resolve,1500));for(const r of list){await record(r,'finish',{status,results:r.results,micRms:rms(),endedAt:audio.currentTime});await r.queue;}$('progress').textContent='저장 완료 · '+status+' · 녹음 '+Math.floor(audio.currentTime)+'초';info('저장됨: '+status+' · '+list.map(r=>r.mode+' '+r.results+'건').join(', '));active=[];const done=jobDone;jobDone=null;if(done)done(status);
}
async function one(job,modes,probe,skipCapture=false,schedule=null){
 active=[];running=true;if(modes.includes('track'))await graph();else await context();if(modes.includes('mic')&&!skipCapture)await microphone();if(speaker)speaker.gain.value=modes.includes('mic')?1:0;audio.muted=humanCheck||externalCheck;audio.src=job.audio;audio.playbackRate=1;audio.currentTime=0;info(job.date+' '+modes.join('+')+' '+(probe?'연결 점검':'전체 시험')+' 시작');
 const done=new Promise(resolve=>jobDone=resolve);await Promise.all(modes.map(m=>recognition(m,job,probe)));
 if(!running)return done;if(schedule)await waitUntil(schedule);if(cancelled){await stopCurrent('user-stopped');return done;}await audio.play();const timer=setInterval(()=>{if(!running){clearInterval(timer);return;}if(probe&&audio.currentTime>=(typeof probe==='number'?probe:30)){clearInterval(timer);stopCurrent('probe-complete')}else if(!probe&&audio.currentTime>90&&active.some(r=>r.results===0)){clearInterval(timer);stopCurrent('no-results-90s')}},250);
 audio.onended=async()=>{if(scheduledSuite)await new Promise(r=>setTimeout(r,10000));stopCurrent(probe?'probe-complete':'complete');};return done;
}
async function probe(modes){if(running)return;cancelled=false;try{await one(config.jobs.find(j=>j.date===$('job').value),modes,true)}catch(e){info('점검 중단: '+e.message);await stopCurrent('probe-error')}}
$('nativeprobe').onclick=()=>{if(!running){cancelled=false;one(config.jobs.find(j=>j.date===$('job').value),['mic'],true,true).catch(async e=>{info('기본 마이크 점검 오류 '+e.message);await stopCurrent('native-probe-error')})}};
$('fullnative').onclick=async()=>{if(running)return;cancelled=false;try{for(const job of config.jobs){if(cancelled)return;const result=await one(job,['mic'],false,true);if(result!=='complete')return;}info('기본 크롬 마이크 네 편 저장 완료')}catch(e){info(e.message);await stopCurrent('native-suite-error')}};
$('outputcheck').onclick=async()=>{if(running)return;running=true;active=[];const job=config.jobs.find(j=>j.date===$('job').value);audio.src=job.audio;audio.currentTime=0;audio.playbackRate=1;await audio.play();info('스피커 확인용 일반 재생 시작 · 120초 후 자동 정지');setTimeout(()=>{if(running&&active.length===0)stopCurrent('output-check-ended')},120000)};
async function rawMic(){if(micStream)micStream.getTracks().forEach(t=>t.stop());await context();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}});analyser=ctx.createAnalyser();ctx.createMediaStreamSource(micStream).connect(analyser);micTrackOverride=true;$('micstate').textContent='실제 마이크 트랙(반향 제거 끔): '+micStream.getAudioTracks()[0].label;info(JSON.stringify(micStream.getAudioTracks()[0].getSettings()));}
$('rawmicprobe').onclick=async()=>{if(running)return;try{await rawMic();await one(config.jobs.find(j=>j.date===$('job').value),['mic'],60,true)}catch(e){info(e.message);await stopCurrent('raw-mic-error')}};
$('rawmicfull').onclick=async()=>{if(running)return;try{await rawMic();cancelled=false;for(const job of config.jobs){if(cancelled)return;const result=await one(job,['mic'],false,true);if(result!=='complete')return;}info('실제 마이크 트랙 네 편 완료')}catch(e){info(e.message);await stopCurrent('raw-mic-error')}};
$('humanprobe').onclick=async()=>{if(running)return;micTrackOverride=false;humanCheck=true;try{await one(config.jobs.find(j=>j.date===$('job').value),['mic'],60,true)}catch(e){info(e.message);await stopCurrent('human-probe-error')}finally{humanCheck=false;audio.muted=false}};
$('externalprobe').onclick=async()=>{if(running)return;micTrackOverride=false;externalCheck=true;try{await microphone();await one(config.jobs.find(j=>j.date===$('job').value),['mic'],120,true)}catch(e){info(e.message);await stopCurrent('external-probe-error')}finally{externalCheck=false;audio.muted=false}};
async function waitUntil(t){while(!cancelled&&Date.now()<t)await new Promise(r=>setTimeout(r,Math.min(500,t-Date.now())));}
$('scheduledmic').onclick=async()=>{if(running||scheduledSuite)return;const start=Number(new URL(location.href).searchParams.get('start'));if(!start||start<Date.now()+10000){info('예약 시작 시각이 없거나 지났습니다. 새 예약 주소가 필요합니다.');return;}scheduledSuite=true;externalCheck=true;micTrackOverride=false;cancelled=false;let at=start;try{await microphone();for(const job of config.jobs){if(cancelled)return;scheduledAt=at;$('job').value=job.date;info(job.date+' 휴대폰 예약 · '+new Date(at).toLocaleTimeString());await waitUntil(at-5000);if(cancelled)return;const status=await one(job,['mic'],false,true,at);if(status!=='complete')return;at+=(job.duration+30)*1000;}info('휴대폰 네 편 실제 크롬 마이크 기록 완료')}catch(e){info(e.message);await stopCurrent('scheduled-mic-error')}finally{scheduledSuite=false;externalCheck=false;scheduledAt=null;audio.muted=false;micStream?.getTracks().forEach(t=>t.stop());micStream=null;analyser=null;}};
$('micprobe').onclick=()=>probe(['mic']);$('trackprobe').onclick=()=>probe(['track']);$('bothprobe').onclick=()=>probe(['mic','track']);
$('stop').onclick=()=>{cancelled=true;stopCurrent('user-stopped')};
async function full(simultaneous){if(running)return;cancelled=false;try{for(const job of config.jobs){const groups=simultaneous?[['mic','track']]:[['mic'],['track']];for(const modes of groups){if(cancelled)return;const result=await one(job,modes,false);if(result!=='complete'){info('전체 시험 중단: '+result);return;}}}info('두 경로 네 편 전체 저장 완료')}catch(e){info('전체 시험 오류 '+e.message);await stopCurrent('suite-error')}}
async function fullSingle(mode){if(running)return;cancelled=false;try{for(const job of config.jobs){if(cancelled)return;const result=await one(job,[mode],false);if(result!=='complete'){info(mode+' 전체 시험 중단: '+result);return;}}info(mode+' 네 편 전체 저장 완료')}catch(e){info(mode+' 전체 시험 오류 '+e.message);await stopCurrent('suite-error')}}
$('selectedtrack').onclick=()=>{if(!running){cancelled=false;one(config.jobs.find(j=>j.date===$('job').value),['track'],false).catch(async e=>{info(e.message);await stopCurrent('run-error')})}};
$('fullmic').onclick=()=>fullSingle('mic');$('fulltrack').onclick=()=>fullSingle('track');
$('fullboth').onclick=()=>full(true);$('fullserial').onclick=()=>full(false);
fetch('/api/config').then(r=>r.json()).then(c=>{config=c;for(const j of c.jobs){const o=document.createElement('option');o.value=j.date;o.textContent=j.date+' · '+Math.floor(j.duration/60)+'분';$('job').appendChild(o)}if(routeCase&&config.jobs.some(j=>j.date===routeCase))$('job').value=routeCase;info('네 편의 원본 녹음 준비 완료')});
</script></html>

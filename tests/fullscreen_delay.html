<!doctype html><html lang="ko"><meta charset="utf-8"><title>전체화면 지연 검사</title><style>body{font:18px sans-serif;background:#142333;color:#fff;padding:32px}button{padding:16px;margin:10px}pre{white-space:pre-wrap}</style><button data-delay="0">새 창 즉시 전체화면 검사</button><button data-delay="200">새 창 0.2초 후 전체화면 검사</button><pre id="result">대기</pre><script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{const delay=button.dataset.delay;const w=window.open('fullscreen_probe.html?delay='+delay,'fullscreen-delay-'+Date.now(),'popup=yes,width=800,height=450');document.querySelector('#result').textContent=w?'검사 중':'팝업 차단';};addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.kind==='fullscreen-probe')document.querySelector('#result').textContent=JSON.stringify(e.data,null,2);});</script></html>

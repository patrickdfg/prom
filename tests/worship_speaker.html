<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>말씀 녹음 네 편 시험 재생</title>
<style>body{font:19px/1.7 sans-serif;padding:22px;max-width:760px;margin:auto;background:#101824;color:#eef4ff}button{font:inherit;padding:15px 20px;margin:8px;background:#315f94;color:white;border:0;border-radius:8px}audio{width:100%}li{padding:7px}.active{color:#9ce5bd;font-weight:bold}#status{font-size:24px}small{color:#becde0}</style>
<h1>말씀 녹음 네 편 시험 재생</h1><p>휴대폰 스피커를 PC 마이크 가까이에 두세요. 준비 버튼을 한 번 누르면 정해진 시각부터 네 편이 원속도로 재생됩니다. 녹음 사이에는 30초 여유를 둡니다. 화면을 켜 두고 다른 소리는 재생하지 마세요.</p>
<p id="status">준비 중</p><button id="ready">네 편 재생 준비</button><button id="stop">전체 중지</button><audio id="audio" controls preload="auto"></audio><ol id="jobs"></ol><p id="detail"></p><small>공개된 원본 녹음 주소를 그대로 재생합니다. 마이크·원고·개인 정보를 이 페이지에서 수집하지 않습니다. 인식과 기록은 PC 크롬에서 수행합니다.</small>
<script>
'use strict';
const jobs=[{date:'20261004',duration:1665.36,file:'1004.mp3'},{date:'20261011',duration:2214.384,file:'1011.mp3'},{date:'20261014',duration:1409.16,file:'1014.mp3'},{date:'20261018',duration:2019.288,file:'1018.mp3'}];
const $=id=>document.getElementById(id),audio=$('audio'),start=Number(new URL(location.href).searchParams.get('start'));let ready=false,cancelled=false,index=0,wake=null;
let at=start;for(const j of jobs){j.at=at;at+=(j.duration+30)*1000;const li=document.createElement('li');li.textContent=j.date+' · '+Math.floor(j.duration/60)+'분';li.id='job-'+j.date;$('jobs').appendChild(li);}
function source(i){audio.src='https://patrickdfg.github.io/malsseum/audio/'+jobs[i].file;audio.playbackRate=1;audio.load();}
async function waitUntil(t){while(!cancelled&&Date.now()<t)await new Promise(r=>setTimeout(r,Math.min(500,t-Date.now())));}
async function playAll(){for(index=0;index<jobs.length&&!cancelled;index++){const j=jobs[index];if(index)source(index);await waitUntil(j.at);if(cancelled)return;const delay=Date.now()-j.at;if(delay>10000){$('status').textContent='시작 시각을 10초 넘겼습니다. PC에서 새 시험 주소를 받아 주세요.';return;}document.querySelectorAll('li').forEach(el=>el.classList.remove('active'));$('job-'+j.date).classList.add('active');$('status').textContent=j.date+' 재생 중';$('detail').textContent='예정 시각과 실제 재생 호출 차이: '+(delay/1000).toFixed(2)+'초';await audio.play();await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=()=>reject(Error('녹음 재생 실패'));});}if(!cancelled){$('status').textContent='네 편 재생 완료';await wake?.release();}}
$('ready').onclick=async()=>{if(ready)return;if(!Number.isFinite(start)||start<Date.now()+3000){$('status').textContent='시험 시작 시각이 없거나 지났습니다. PC에서 새 시험 주소를 받아 주세요.';return;}try{cancelled=false;source(0);audio.muted=true;await audio.play();audio.pause();audio.currentTime=0;audio.muted=false;ready=true;$('ready').disabled=true;try{wake=await navigator.wakeLock?.request('screen')}catch(_){}playAll().catch(e=>{$('status').textContent=e.message;});}catch(e){$('status').textContent='재생 준비 오류: '+e.message;}};
$('stop').onclick=()=>{cancelled=true;audio.pause();$('status').textContent='중지됨';wake?.release();};
setInterval(()=>{if(cancelled)return;if(!start||!Number.isFinite(start)){$('status').textContent='PC에서 받은 시험 주소로 열어 주세요.';return;}if(Date.now()<start)$('status').textContent=(ready?'준비 완료 · ':'준비 버튼을 눌러 주세요 · ')+Math.max(0,Math.ceil((start-Date.now())/1000))+'초 후 시작';},250);
</script></html>

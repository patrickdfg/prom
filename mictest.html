<!doctype html>
<!-- 프롬프터 없이 크롬 음성인식만 켜서 이 기기에서 인식이 되는지 확인하는 시험 페이지 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>음성인식 시험</title>
<style>
body{margin:0;padding:16px;background:#111;color:#eee;font:16px/1.5 system-ui,sans-serif}
button{font-size:18px;padding:12px 18px;margin:4px 4px 4px 0;border-radius:8px;border:1px solid #555;background:#222;color:#fff}
#txt{font-size:22px;min-height:3em;margin:12px 0;padding:10px;background:#000;border-radius:8px;color:#ff0}
#log{font-size:13px;color:#9cf;white-space:pre-wrap;background:#000;padding:10px;border-radius:8px;max-height:50vh;overflow:auto}
label{display:block;margin:8px 0}
</style>
</head>
<body>
<h2 style="margin:0 0 8px">음성인식 시험</h2>
<div id="ua" style="font-size:12px;color:#888"></div>
<label><input type="checkbox" id="cont" checked> 계속 듣기(continuous)</label>
<button id="go">시작</button><button id="stop">멈춤</button>
<div id="txt">여기에 들린 글자가 나옵니다</div>
<div id="log"></div>
<script>
const $=id=>document.getElementById(id), t0=Date.now();
const log=m=>{$('log').textContent=((Date.now()-t0)/1000).toFixed(1)+'초 '+m+'\n'+$('log').textContent};
$('ua').textContent=navigator.userAgent;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)log('이 브라우저에는 음성인식이 없습니다. 크롬으로 여세요.');
let rec=null;
$('go').onclick=()=>{
  if(!SR)return;
  if(rec)try{rec.abort()}catch(_){}
  rec=new SR(); rec.lang='ko-KR'; rec.interimResults=true; rec.continuous=$('cont').checked;
  ['start','audiostart','soundstart','speechstart','speechend','soundend','audioend','nomatch','end'].forEach(ev=>rec.addEventListener(ev,()=>log(ev)));
  rec.onerror=e=>log('오류 '+e.error+(e.message?' '+e.message:''));
  rec.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+(e.results[i].isFinal?' [확정] ':'');$('txt').textContent=s;log('결과 '+s.slice(-30))};
  try{rec.start();log('start 호출')}catch(e){log('start 실패 '+e.name)}
};
$('stop').onclick=()=>{if(rec)try{rec.stop()}catch(_){}};
</script>
</body>
</html>
